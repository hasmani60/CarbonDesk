name: SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Sonar token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Add repository secret SONAR_TOKEN (SonarCloud: My Account → Security, or SonarQube user token)."
            exit 1
          fi

      # Optional: override SonarCloud org/project without editing sonar-project.properties.
      # Repo → Settings → Secrets and variables → Actions → Variables:
      #   SONAR_ORGANIZATION, SONAR_PROJECT_KEY
      - name: Apply SonarCloud project overrides (optional)
        if: ${{ vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' }}
        run: |
          ORG="${{ vars.SONAR_ORGANIZATION }}"
          KEY="${{ vars.SONAR_PROJECT_KEY }}"
          grep -v '^sonar.organization=' sonar-project.properties | grep -v '^sonar.projectKey=' > sonar-project.tmp
          mv sonar-project.tmp sonar-project.properties
          printf '\nsonar.organization=%s\nsonar.projectKey=%s\n' "$ORG" "$KEY" >> sonar-project.properties
          echo "Using SonarCloud org/project from repository variables."

      # IMPORTANT (SonarQube Cloud):
      # Do NOT pass SONAR_HOST_URL when using SonarCloud — `SONAR_HOST_URL=` (empty)
      # makes the CLI treat the target like SonarQube Server and fails with exit code 3.
      #
      # Self-hosted SonarQube Server: add repository **variable** SONAR_HOST_URL (secrets do not work in our split).
      - name: Strip SonarCloud-only keys for SonarQube Server
        if: ${{ vars.SONAR_HOST_URL != '' }}
        run: |
          grep -v '^sonar.organization=' sonar-project.properties > sonar-project.tmp
          mv sonar-project.tmp sonar-project.properties
          echo "Removed sonar.organization (SonarCloud-only) before Server analysis."

      # Shows the exact properties the CLI will read (helps fix wrong project/org keys).
      - name: Effective sonar-project.properties
        run: grep -v '^\s*#' sonar-project.properties | grep -v '^\s*$' || true

      - name: SonarQube Scan (SonarCloud)
        if: ${{ vars.SONAR_HOST_URL == '' }}
        uses: SonarSource/sonarqube-scan-action@v8.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Scan (SonarQube Server — self-hosted)
        if: ${{ vars.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

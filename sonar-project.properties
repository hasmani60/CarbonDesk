# SonarCloud — CarbonDesk (SonarCloud Automatic Analysis from GitHub)
# -------------------------------------------------------------------
# Analysis runs in SonarCloud after each push (no GitHub Actions Sonar workflow).
# This file is optional: it can narrow sources/exclusions. Tune in SonarCloud UI as well.
#
# Project key / org are defined when the project was created in SonarCloud; you usually
# do not need to duplicate them here for Automatic Analysis unless your setup requires it.

# If your Cloud project expects these in-repo, keep them aligned with Administration → Update Key:
sonar.organization=hasmani60
sonar.projectKey=hasmani60_CarbonDesk

# Source roots (exclude tests from "sources" unless you want them analyzed as prod code)
sonar.sources=frontend/src,backend

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.env*,**/uploads/**,**/*.min.js,**/vendor/**,.github/**

sonar.sourceEncoding=UTF-8

# JavaScript / TypeScript (Vite React frontend + Node backend)
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

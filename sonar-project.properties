# SonarCloud / SonarQube configuration for CarbonDesk (monorepo)
#
# SonarCloud: In https://sonarcloud.io → your project → Administration → Update Key —
# copy the Organization key and Project key here. They MUST match exactly.
#
# Default pattern when linking GitHub repo: org = GitHub username/org, projectKey = org_reponame
# If analysis still fails, replace the two lines below with the values shown in SonarCloud.
sonar.organization=hasmani60
sonar.projectKey=hasmani60_CarbonDesk

# Source roots (exclude tests from "sources" unless you want them analyzed as prod code)
sonar.sources=frontend/src,backend

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.env*,**/uploads/**,**/*.min.js,**/vendor/**,.github/**

sonar.sourceEncoding=UTF-8

# JavaScript / TypeScript (Vite React frontend + Node backend)
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx
